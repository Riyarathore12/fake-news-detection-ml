<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>📰 Fake News Detection</h1>

    <form method="POST">
        <textarea name="news" placeholder="Paste news article here..." required></textarea>
        <button type="submit">Check News</button>
    </form>

    {% if prediction is not none %}
        <div class="result {{ 'real' if prediction==1 else 'fake' }}">
            {{ 'REAL NEWS ✅' if prediction==1 else 'FAKE NEWS ❌' }}

            <div class="confidence">
                Confidence: {{ confidence|round(2) }}%
            </div>
        </div>
    {% endif %}

    <div class="footer">
        ⚠️ Prediction is based on language patterns, not real-time verification.
    </div>
</div>

</body>
</html>
